name: Native build and evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset cpu-${{ matrix.config }}
      - run: cmake --build --preset cpu-${{ matrix.config }} --parallel 2
      - run: ctest --preset cpu-${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-${{ matrix.config }}-logs
          path: build/cpu-${{ matrix.config }}/Testing/Temporary/
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ./scripts/fetch-dxc.ps1
      - name: Configure CMake
        run: cmake --preset windows
      - name: Build
        run: cmake --build build/windows --config ${{ matrix.config }} --parallel 4
      - name: CPU and command-line tests
        run: ctest --test-dir build/windows -C ${{ matrix.config }} --output-on-failure
      - name: Capture actual Windows app
        run: ./scripts/capture-window.ps1 -Executable ./build/windows/${{ matrix.config }}/white_app.exe
      - name: Fixed Phase-0 recipe comparisons
        if: matrix.config == 'Release'
        run: ./scripts/capture-gate.ps1 -Executable ./build/windows/Release/white_app.exe
      - name: HG phase comparison captures
        if: matrix.config == 'Release'
        run: ./scripts/capture-gate.ps1 -Executable ./build/windows/Release/white_app.exe -RecipeDirectory ./tests/fixtures/phase -OutputDirectory evidence/phase -ExportHdr
      - name: Sun cache comparisons
        if: matrix.config == 'Release'
        run: ./scripts/capture-sun.ps1 -Executable ./build/windows/Release/white_app.exe -Compare ./build/windows/Release/white_hdr_compare.exe
      - name: Conservative empty-space comparisons
        if: matrix.config == 'Release'
        run: ./scripts/capture-majorant.ps1 -Executable ./build/windows/Release/white_app.exe -Compare ./build/windows/Release/white_hdr_compare.exe
      - name: Settled progressive comparisons
        if: matrix.config == 'Release'
        run: ./scripts/capture-progressive.ps1 -Executable ./build/windows/Release/white_app.exe -Compare ./build/windows/Release/white_hdr_compare.exe
      - name: Diagnostic view comparisons
        if: matrix.config == 'Release'
        run: ./scripts/capture-diagnostics.ps1 -Executable ./build/windows/Release/white_app.exe -Check ./build/windows/Release/white_diagnostic_check.exe
      - name: Preview approximation comparison
        if: matrix.config == 'Release'
        run: ./scripts/capture-approx.ps1 -Executable ./build/windows/Release/white_app.exe -Compare ./build/windows/Release/white_hdr_compare.exe
      - name: Cumulonimbus creation and parameter gizmos
        if: matrix.config == 'Release'
        run: ./scripts/capture-prefab.ps1 -Executable ./build/windows/Release/white_app.exe
      - name: Bounded edit benchmark
        if: matrix.config == 'Release'
        run: ./scripts/benchmark-editor.ps1 -Executable ./build/windows/Release/white_app.exe -InternalWidth 160 -Updates 60
      - name: Dependency notices
        run: |
          Copy-Item LICENSE,THIRD_PARTY.md evidence/
          Copy-Item build/windows/_deps/tinyexr-src/tinyexr.h evidence/TINYEXR-source-with-license.h
          Copy-Item build/windows/_deps/tinyexr-src/deps/miniz/miniz.c evidence/MINIZ-source-with-license.c
          Copy-Item build/windows/_deps/sdl3-src/LICENSE.txt evidence/SDL-LICENSE.txt
          Copy-Item build/windows/_deps/imgui-src/LICENSE.txt evidence/IMGUI-LICENSE.txt
          Copy-Item build/windows/_deps/imguizmo-src/LICENSE evidence/IMGUIZMO-LICENSE.txt
          Copy-Item build/windows/_deps/nlohmann_json-src/LICENSE.MIT evidence/JSON-LICENSE.txt
          Get-ChildItem tools/dxc -Filter '*LICENSE*' | Copy-Item -Destination evidence/
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,AdapterRAM | Format-List | Out-File evidence/adapters.txt
          "commit=${{ github.sha }}`nconfiguration=${{ matrix.config }}`nrunner=windows-2022`nbackend=D3D12`nRTX-performance=not-validated" | Out-File evidence/build-info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.config }}-evidence
          path: |
            evidence/
            build/windows/${{ matrix.config }}/white_app.exe
            build/windows/${{ matrix.config }}/SDL3.dll
            build/windows/${{ matrix.config }}/shaders/
            build/windows/Testing/Temporary/
